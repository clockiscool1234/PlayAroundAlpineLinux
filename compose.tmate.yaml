# Optional self-hosted tmate relay for `ssh` access to user containers.
#
#   cp .env.example .env
#   # set TMATE_SSH_HOST to a hostname or IP reachable by your users
#   docker compose -f compose.yaml -f compose.tmate.yaml up -d --build
#
# The relay listens on port 2222 inside Compose and is published on
# TMATE_PUBLISH_PORT (default 2222). TMATE_SSH_PORT must be the port users can
# actually reach from outside; it is advertised in the `ssh` command tmate
# prints. If the host is behind NAT, forward that port first.
#
# tmate requires SYS_ADMIN to create the isolated namespace for each relayed
# session. Only enable this overlay if you need SSH access.

services:
  tmate-keys:
    build: ./tmate
    image: playaround-tmate-keys:3.20
    restart: "no"
    network_mode: none
    environment:
      KEYS_PATH: /keys
    volumes:
      - ./data/tmate:/keys

  tmate:
    image: tmate/tmate-ssh-server:latest
    restart: unless-stopped
    depends_on:
      tmate-keys:
        condition: service_completed_successfully
    environment:
      SSH_KEYS_PATH: /keys
      SSH_HOSTNAME: "${TMATE_SSH_HOST:-localhost}"
      SSH_PORT_LISTEN: "2222"
      SSH_PORT_ADVERTISE: "${TMATE_SSH_PORT:-2222}"
    volumes:
      - ./data/tmate:/keys:ro
    ports:
      - "${TMATE_PUBLISH_PORT:-2222}:2222"
    cap_add:
      - SYS_ADMIN
    mem_limit: 256m
    pids_limit: 256
    networks:
      filtered:
        ipv4_address: 172.30.0.3
      egress:

  bot:
    environment:
      TMATE_SERVER_HOST: "${TMATE_SERVER_HOST:-tmate}"
      TMATE_SERVER_PORT: "${TMATE_SERVER_PORT:-2222}"
      TMATE_KEYS_PATH: "${TMATE_KEYS_PATH:-/app/data/tmate}"
    depends_on:
      tmate-keys:
        condition: service_completed_successfully
      tmate:
        condition: service_started
