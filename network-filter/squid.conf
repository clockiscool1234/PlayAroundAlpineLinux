http_port 3128
visible_hostname alpine-network-filter

# The user-container network is fixed in compose.yaml. Only clients on that
# internal network may use this proxy.
acl user_containers src 172.30.0.0/24
acl manager proto cache_object
acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80 443
acl Safe_ports port 21 70 210 280 488 591 777 1025-65535

acl bad_websites dstdomain -n "/run/squid/bad-websites.txt"
acl phishing_domains dstdomain -n "/run/squid/phishing-domains.txt"
acl custom_domains dstdomain -n "/run/squid/custom-domains.txt"
acl phishing_ips dst "/run/squid/phishing-ips.txt"
acl private_destinations dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10
acl private_destinations dst 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl private_destinations dst 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15
acl private_destinations dst 224.0.0.0/4 240.0.0.0/4
acl private_destinations dst ::1/128 fc00::/7 fe80::/10

# Direct IP destinations bypass domain policy, so reject them. This covers
# IPv4 and the usual bracketed/unbracketed IPv6 forms used by CONNECT.
acl literal_ipv4 dstdom_regex -n ^[0-9]+(\.[0-9]+){3}$
acl literal_ipv6 dstdom_regex -n -i ^\[?[0-9a-f:]+\]?$

http_access deny manager
http_access deny !user_containers
include /run/squid/policy.conf
http_access allow user_containers
http_access deny all

# Do not disclose the container's internal address to destination sites.
forwarded_for delete
via off

# Populated by entrypoint.sh. When a WireGuard HTTP proxy is configured this
# contains a cache_peer and never_direct allow all, so a VPN outage fails
# closed instead of falling back to the host's public IP.
include /run/squid/upstream.conf

# The proxy is a policy gateway, not a content cache.
cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename /run/squid/squid.pid
